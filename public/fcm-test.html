<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REPS · FCM test</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f5f7f7; color: #17212b; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(560px, 100%); box-sizing: border-box; padding: 28px; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(23,33,43,.14); }
      .eyebrow { margin: 0; color: #28616b; font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: 1.7rem; } p { line-height: 1.5; color: #52636d; }
      button { width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 10px; padding: 10px 14px; color: #fff; background: #25444c; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; } button.secondary { color: #25444c; background: #eaf1f1; }
      pre { overflow-wrap: anywhere; white-space: pre-wrap; padding: 12px; border-radius: 10px; background: #f0f4f4; color: #25444c; font-size: .78rem; }
      #status { min-height: 24px; margin: 16px 0 0; font-weight: 700; } .error { color: #a22828; } .success { color: #176b3a; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">REPS developer utility</p>
      <h1>Firebase push test</h1>
      <p>Enable notifications, copy this browser's FCM registration token, then send a Firebase Console test message to that token.</p>
      <button id="enable" type="button">Enable push notifications</button>
      <button id="copy" class="secondary" type="button" hidden>Copy registration token</button>
      <p id="status" role="status"></p>
      <pre id="token" hidden></pre>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getMessaging, getToken, isSupported, onMessage } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDrD8VQP0AcHp8uJI1IjFakHn214hav9j4",
        authDomain: "notification-service-reps.firebaseapp.com",
        projectId: "notification-service-reps",
        storageBucket: "notification-service-reps.firebasestorage.app",
        messagingSenderId: "514965369233",
        appId: "1:514965369233:web:4bb7a21f33f365a42f6a30"
      };
      const vapidKey = "BFme_RsLQDpkAkWzvSDvwa2w57Tgb0-g8WwFJd1HLSUfwJCWNDHniP-mbeOA7PHayctJ4KEcjLEJL9RRmwhuqCM";
      const status = document.querySelector("#status");
      const tokenView = document.querySelector("#token");
      const enable = document.querySelector("#enable");
      const copy = document.querySelector("#copy");
      let registrationToken = "";

      const setStatus = (message, kind = "") => {
        status.textContent = message;
        status.className = kind;
      };

      enable.addEventListener("click", async () => {
        enable.disabled = true;
        setStatus("Requesting notification permission…");
        try {
          if (!(await isSupported())) throw new Error("Firebase Messaging is not supported by this browser.");
          const permission = await Notification.requestPermission();
          if (permission !== "granted") throw new Error("Notification permission was not granted.");

          const worker = await navigator.serviceWorker.register("/fcm-test-sw.js");
          const messaging = getMessaging(initializeApp(firebaseConfig));
          registrationToken = await getToken(messaging, { vapidKey, serviceWorkerRegistration: worker });
          if (!registrationToken) throw new Error("Firebase did not return a registration token.");

          tokenView.textContent = registrationToken;
          tokenView.hidden = false;
          copy.hidden = false;
          enable.textContent = "Push notifications enabled";
          setStatus("Ready. Copy the token and send a Firebase Console test message.", "success");

          onMessage(messaging, (payload) => {
            const title = payload.notification?.title || payload.data?.title || "REPS";
            const body = payload.notification?.body || payload.data?.body || "Push message received.";
            setStatus(`Foreground message received: ${title} — ${body}`, "success");
          });
        } catch (error) {
          console.error(error);
          enable.disabled = false;
          setStatus(error instanceof Error ? error.message : "Push setup failed.", "error");
        }
      });

      copy.addEventListener("click", async () => {
        await navigator.clipboard.writeText(registrationToken);
        setStatus("Registration token copied. Paste it into Firebase Console's test-message dialog.", "success");
      });
    </script>
  </body>
</html>
